name: LLM Code Review by arepresas
description: 'A Code Review Action Powered By ChatGPT compatible LLM'
inputs:
  github-token:
    description: 'Token used to read the pull request and post the review. Defaults to the workflow GITHUB_TOKEN.'
    default: ${{ github.token }}
    required: false
branding:
  icon: 'gift'
  color: orange
runs:
  using: 'node24'
  main: 'action/index.cjs'
